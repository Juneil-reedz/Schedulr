name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# Add these in GitHub: Settings > Secrets and variables > Actions.
#   TAURI_SIGNING_PRIVATE_KEY  signs each installer so installed copies can update themselves
#   WEB3FORMS_KEY              lets the feedback form send straight to the developer's email
# The build still works without them: updates are then not published and feedback opens
# the person's email app instead.
env:
  HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests (database, recurrence, reminders, .ics)
        run: cargo test --lib
        working-directory: src-tauri
      - name: Skip update signing (no key added yet)
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build the installers
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - name: Write the update feed
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: node scripts/update-feed.mjs "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: schedulr-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Read the app version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      # Every build of main refreshes the release for the current version, so its download page
      # always has the newest installer. Raising "version" in tauri.conf.json (and Cargo.toml,
      # package.json) starts a new release, and installed copies are offered the update.
      - name: Publish the release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Schedulr ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            latest.json
