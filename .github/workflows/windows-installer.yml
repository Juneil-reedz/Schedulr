name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests (database, recurrence, reminders, .ics)
        run: cargo test --lib
        working-directory: src-tauri
      - name: Build the installers
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: schedulr-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Read the app version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      # Every build of main refreshes the release for the current version, so its download page
      # always has the newest installer. Raising "version" in tauri.conf.json starts a new release.
      - name: Publish the release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Schedulr ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
