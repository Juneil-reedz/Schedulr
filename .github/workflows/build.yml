name: Build and release

on:
  workflow_dispatch:
  push:
    # dev/* branches build and test only; main also publishes the release.
    branches: [main, "dev/**"]
    tags: ["v*"]
    # Text-only changes (like the privacy policy) do not rebuild the app.
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

# Add these in GitHub: Settings > Secrets and variables > Actions.
#   TAURI_SIGNING_PRIVATE_KEY  signs each installer so installed copies can update themselves
#   WEB3FORMS_KEY              lets the feedback form send straight to the developer's email
# The build still works without them: updates are then not published and feedback opens
# the person's email app instead.
env:
  HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests (database, recurrence, reminders, .ics, Windows voices)
        run: cargo test --lib -- --nocapture
        working-directory: src-tauri
      - name: Skip update signing (no key added yet)
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build the Windows installers
        run: npm run tauri build -- --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
      # The Microsoft Store package. Upload it in Partner Center; the Store signs it and
      # delivers its updates, so the Store version never updates itself.
      - name: Build the Microsoft Store package (.msix)
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/msix/build.ps1 -Exe src-tauri/target/release/schedulr.exe -Version $v -Out "store/Schedulr_$($v).0_x64.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store
          if-no-files-found: error
          path: store/*.msix

  linux:
    # The oldest supported Ubuntu, so the packages run on as many Linux systems as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri
      - name: Skip update signing (no key added yet)
        if: env.HAS_SIGNING_KEY != 'true'
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build the Linux packages (.deb, .rpm, AppImage)
        run: npm run tauri build -- --bundles deb,rpm,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  # Every build of main refreshes the release for the current version, so its download page
  # always has the newest installers. Raising "version" in tauri.conf.json (and Cargo.toml,
  # package.json) starts a new release, and installed copies are offered the update.
  release:
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the update feed
        if: env.HAS_SIGNING_KEY == 'true'
        run: node scripts/update-feed.mjs "${{ github.repository }}" dist
      - name: Read the app version
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - run: ls -laR dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Schedulr ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            dist/**/*.exe
            dist/**/*.exe.sig
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.deb.sig
            dist/**/*.rpm
            dist/**/*.rpm.sig
            dist/**/*.AppImage
            dist/**/*.AppImage.sig
            dist/latest.json
